apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: nexconnect
  labels:
    app: worker
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: nexconnect
    app.kubernetes.io/component: worker
spec:
  replicas: 10
  selector:
    matchLabels:
      app: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  template:
    metadata:
      labels:
        app: worker
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: nexconnect
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: registry.orbitmind.io/nexconnect-worker:latest
          envFrom:
            - configMapRef:
                name: nexconnect-config
            - secretRef:
                name: nexconnect-secrets
          env:
            - name: WORKER_POD_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 6Gi
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "sleep 5 && kill -SIGTERM 1"
