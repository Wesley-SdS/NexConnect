apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: nexconnect
  labels:
    app: api
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: nexconnect
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: nexconnect
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: registry.orbitmind.io/nexconnect-api:latest
          ports:
            - containerPort: 3100
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nexconnect-config
            - secretRef:
                name: nexconnect-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 3100
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /v1/health
              port: 3100
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
